<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>虚拟手机 · 锁屏 (极简风)</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #111; /* 页面背景，衬托手机 */
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
    padding: 20px;
  }

  /* ===== 手机外壳 ===== */
  .phone {
    width: 340px;
    height: 700px;
    background: #000;
    border-radius: 48px;
    padding: 10px;
    position: relative;
    box-shadow:
      0 0 0 2px #2c2c2e,
      0 0 0 5px #1a1a1a,
      0 40px 80px rgba(0, 0, 0, 0.8),
      inset 0 0 0 1px #3a3a3c;
  }

  /* 侧边按键 */
  .phone::before,
  .phone::after {
    content: "";
    position: absolute;
    width: 3px;
    background: #2c2c2e;
    border-radius: 2px;
  }
  .phone::before { left: -4px; top: 130px; height: 65px; }   /* 音量键 */
  .phone::after  { right: -4px; top: 150px; height: 95px; }  /* 电源键 */

  /* ===== 屏幕 ===== */
  .screen {
    width: 100%;
    height: 100%;
    border-radius: 38px;
    overflow: hidden;
    position: relative;
    background: #000000; /* 纯黑壁纸 */
    display: flex;
    flex-direction: column;
    color: #fff;
  }

  /* 灵动岛 (保持黑边隐藏) */
  .dynamic-island {
    position: absolute;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    width: 110px;
    height: 32px;
    background: #000;
    border-radius: 20px;
    z-index: 20;
  }

  /* ===== 锁屏核心内容 ===== */
  .lock-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 70px; /* 往下压一点，避开灵动岛 */
    z-index: 5;
  }

  /* 开锁图标 */
  .lock-icon {
    font-size: 32px;
    line-height: 1;
    margin-bottom: 15px;
  }

  /* 超大时间 */
  .time {
    font-size: 86px;
    font-weight: 400; /* 图片中的字体偏细 */
    letter-spacing: -2px;
    line-height: 1.1;
    font-variant-numeric: tabular-nums;
  }

  /* 日期 */
  .date-row {
    margin-top: 5px;
    font-size: 18px;
    font-weight: 500;
    letter-spacing: 0.2px;
    color: #ffffff;
  }

  /* 中间的心形按钮 */
  .heart-btn {
    margin-top: 25px;
    width: 50px;
    height: 28px;
    background: #1a1a1a; /* 深灰色背景 */
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .heart-btn:hover {
    background: #2a2a2a;
  }

  /* ===== 底部区域 ===== */
  .bottom-area {
    width: 100%;
    padding: 0 30px 30px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    z-index: 5;
  }

  /* 底部按钮排布 */
  .quick-actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
  }

  .qa-btn {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: #1a1a1a; /* 深灰色背景 */
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    cursor: pointer;
    transition: transform 0.2s, background 0.2s;
  }
  .qa-btn:hover {
    transform: scale(1.1);
    background: #2a2a2a;
  }
  
  /* 手电筒和相机的 SVG 图标颜色 */
  .qa-btn svg {
    width: 22px;
    height: 22px;
    fill: #fff;
  }

  /* 上滑解锁文字 */
  .swipe-text {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.5px;
    color: #ffffff;
    margin-bottom: 10px;
    animation: bounce 2s infinite; /* 加一点呼吸动画 */
  }

  @keyframes bounce {
    0%, 100% { transform: translateY(0); opacity: 0.8; }
    50% { transform: translateY(-5px); opacity: 1; }
  }

</style>
</head>
<body>

<div class="phone">
  <div class="screen">

    <!-- 灵动岛 -->
    <div class="dynamic-island"></div>

    <!-- 锁屏内容 -->
    <div class="lock-content">
      
      <!-- 开锁图标 -->
      <div class="lock-icon">🔓</div>

      <!-- 时间 -->
      <div class="time" id="clock">09:46</div>

      <!-- 日期 (图片中为英文) -->
      <div class="date-row" id="dateText">Tuesday, 21 December</div>

      <!-- 心形按钮 -->
      <div class="heart-btn">🤍</div>

    </div>

    <!-- 底部区域 -->
    <div class="bottom-area">
      
      <!-- 快捷按钮 -->
      <div class="quick-actions">
        <!-- 手电筒图标 (SVG) -->
        <div class="qa-btn">
          <svg viewBox="0 0 24 24"><path d="M11 2h2v2h-2V2zm-1 3h4v3h-4V5zm-1 4h6v13a1 1 0 0 1-1 1h-4a1 1 0 0 1-1-1V9zm2 2v2h2v-2h-2z"/></svg>
        </div>
        <!-- 相机图标 (SVG) -->
        <div class="qa-btn">
          <svg viewBox="0 0 24 24"><path d="M20 5h-3.17L15 3H9L7.17 5H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm-8 13c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.65 0-3 1.35-3 3s1.35 3 3 3 3-1.35 3-3-1.35-3-3-3z"/></svg>
        </div>
      </div>

      <!-- 上滑解锁文字 -->
      <div class="swipe-text">Swipe up to unlock</div>

    </div>

  </div>
</div>

<script>
  // 实时时间 + 英文日期
  function updateClock() {
    const now = new Date();

    // 时间：HH:MM（补零）
    const h = String(now.getHours()).padStart(2, '0');
    const m = String(now.getMinutes()).padStart(2, '0');
    document.getElementById('clock').textContent = `${h}:${m}`;

    // 英文日期：Tuesday, 21 December
    const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    
    const dayName = days[now.getDay()];
    const dayNum = now.getDate();
    const monthName = months[now.getMonth()];
    
    document.getElementById('dateText').textContent = `${dayName}, ${dayNum} ${monthName}`;
  }

  updateClock();
  setInterval(updateClock, 1000); // 每秒刷新一次，保证时间准确

</script>

</body>
</html>
