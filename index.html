<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>虚拟手机</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #1a1a2e, #16213e);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }

  /* 手机外壳 */
  .phone {
    width: 320px;
    height: 660px;
    background: #0d0d0d;
    border-radius: 44px;
    padding: 12px;
    box-shadow:
      0 0 0 2px #2a2a2a,
      0 30px 60px rgba(0,0,0,0.6),
      inset 0 0 0 1px #3a3a3a;
    position: relative;
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  /* 侧边按键 */
  .phone::before,
  .phone::after {
    content: "";
    position: absolute;
    width: 3px;
    background: #2a2a2a;
    border-radius: 2px;
  }
  .phone::before { left: -3px; top: 120px; height: 60px; }  /* 音量键 */
  .phone::after  { right: -3px; top: 140px; height: 90px; } /* 电源键 */

  /* 屏幕 */
  .screen {
    width: 100%;
    height: 100%;
    background: linear-gradient(180deg, #1c1c2e 0%, #0f0f1a 100%);
    border-radius: 34px;
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
  }

  /* 灵动岛 / 刘海 */
  .notch {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    width: 100px;
    height: 26px;
    background: #000;
    border-radius: 20px;
    z-index: 10;
  }

  /* 状态栏 */
  .status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 22px 0;
    font-size: 12px;
    color: #fff;
    font-weight: 600;
    z-index: 5;
  }
  .status-right { display: flex; gap: 5px; align-items: center; }
  .battery {
    width: 22px; height: 11px;
    border: 1.5px solid #fff;
    border-radius: 3px;
    position: relative;
    padding: 1px;
  }
  .battery::after {
    content: "";
    position: absolute;
    right: -4px; top: 3px;
    width: 2px; height: 5px;
    background: #fff;
    border-radius: 0 1px 1px 0;
  }
  .battery-fill {
    width: 75%; height: 100%;
    background: #4ade80;
    border-radius: 1px;
  }

  /* 屏幕内容区 */
  .content {
    flex: 1;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    overflow-y: auto;
  }
  .content::-webkit-scrollbar { width: 0; }

  .app-title {
    color: #fff;
    font-size: 26px;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .app-subtitle {
    color: #8a8aa0;
    font-size: 13px;
    margin-bottom: 10px;
  }

  /* 消息卡片 */
  .msg-card {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px;
    padding: 14px;
    display: flex;
    gap: 12px;
    align-items: center;
    backdrop-filter: blur(10px);
    transition: background 0.2s;
    cursor: pointer;
  }
  .msg-card:hover { background: rgba(255,255,255,0.12); }

  .avatar {
    width: 44px; height: 44px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
  }
  .avatar.a1 { background: linear-gradient(135deg, #667eea, #764ba2); }
  .avatar.a2 { background: linear-gradient(135deg, #f093fb, #f5576c); }
  .avatar.a3 { background: linear-gradient(135deg, #4facfe, #00f2fe); }

  .msg-info { flex: 1; min-width: 0; }
  .msg-name {
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 3px;
  }
  .msg-preview {
    color: #8a8aa0;
    font-size: 12px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .msg-time {
    color: #6a6a80;
    font-size: 11px;
    flex-shrink: 0;
  }

  /* 底部 Dock */
  .dock {
    display: flex;
    justify-content: space-around;
    padding: 12px 20px 20px;
    background: rgba(255,255,255,0.04);
    border-top: 1px solid rgba(255,255,255,0.06);
  }
  .dock-icon {
    width: 46px; height: 46px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    cursor: pointer;
    transition: transform 0.2s;
  }
  .dock-icon:hover { transform: translateY(-4px); }
  .d1 { background: linear-gradient(135deg, #34d399, #059669); }
  .d2 { background: linear-gradient(135deg, #60a5fa, #2563eb); }
  .d3 { background: linear-gradient(135deg, #fbbf24, #d97706); }
  .d4 { background: linear-gradient(135deg, #f472b6, #db2777); }

  /* Home 指示条 */
  .home-bar {
    position: absolute;
    bottom: 8px;
    left: 50%;
    transform: translateX(-50%);
    width: 120px;
    height: 5px;
    background: rgba(255,255,255,0.5);
    border-radius: 3px;
  }
</style>
</head>
<body>

<div class="phone" id="phone">
  <div class="screen">
    <div class="notch"></div>

    <!-- 状态栏 -->
    <div class="status-bar">
      <span>9:41</span>
      <div class="status-right">
        <span>📶</span>
        <span>📡</span>
        <div class="battery"><div class="battery-fill"></div></div>
      </div>
    </div>

    <!-- 内容 -->
    <div class="content">
      <div class="app-title">信息</div>
      <div class="app-subtitle">3 条未读消息</div>

      <div class="msg-card">
        <div class="avatar a1">👤</div>
        <div class="msg-info">
          <div class="msg-name">未知号码</div>
          <div class="msg-preview">你捡到这部手机了吗？</div>
        </div>
        <div class="msg-time">刚刚</div>
      </div>

      <div class="msg-card">
        <div class="avatar a2">📸</div>
        <div class="msg-info">
          <div class="msg-name">相册提醒</div>
          <div class="msg-preview">昨晚 23:47 有 5 张新照片</div>
        </div>
        <div class="msg-time">2 分钟</div>
      </div>

      <div class="msg-card">
        <div class="avatar a3">🔋</div>
        <div class="msg-info">
          <div class="msg-name">系统</div>
          <div class="msg-preview">电量仅剩 18%，请尽快充电</div>
        </div>
        <div class="msg-time">5 分钟</div>
      </div>
    </div>

    <!-- Dock -->
    <div class="dock">
      <div class="dock-icon d1">💬</div>
      <div class="dock-icon d2">📷</div>
      <div class="dock-icon d3">🎵</div>
      <div class="dock-icon d4">⚙️</div>
    </div>

    <div class="home-bar"></div>
  </div>
</div>

<script>
  // 简单交互：点击消息卡片高亮
  document.querySelectorAll('.msg-card').forEach(card => {
    card.addEventListener('click', () => {
      card.style.background = 'rgba(96,165,250,0.25)';
      setTimeout(() => card.style.background = '', 300);
    });
  });
</script>

</body>
</html>
