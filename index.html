<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>虚拟手机 · 锁屏</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: radial-gradient(circle at 50% 50%, #2a2a35 0%, #0a0a0f 100%);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", sans-serif;
    padding: 20px;
  }

  /* ===== 手机外壳 ===== */
  .phone {
    width: 340px;
    height: 720px; /* 比例大约是 1:2.1，适合大部分竖屏图 */
    background: #000;
    border-radius: 48px;
    padding: 8px; /* 黑边框厚度 */
    position: relative;
    box-shadow: 
      0 0 0 2px #2c2c2e,
      0 0 0 5px #1a1a1a,
      0 40px 80px rgba(0, 0, 0, 0.8),
      inset 0 0 0 1px #3a3a3c;
  }

  /* 侧边按键 */
  .phone::before, .phone::after {
    content: ""; position: absolute; width: 3px; background: #2c2c2e; border-radius: 2px;
  }
  .phone::before { left: -4px; top: 130px; height: 65px; }
  .phone::after  { right: -4px; top: 150px; height: 95px; }

  /* ===== 屏幕区域 ===== */
  .screen {
    width: 100%;
    height: 100%;
    border-radius: 40px;
    overflow: hidden;
    position: relative;
    
    /* 🔴 这里替换为你的图片路径 */
    background-image: url('4f508406c76b6b1242ff6e27cd1b7b67.jpg'); 
    background-size: cover;      /* 让图片铺满屏幕 */
    background-position: center; /* 居中对齐 */
    background-repeat: no-repeat;
    
    /* 如果你的图片不是纯黑，可以加一点暗色遮罩让状态栏更清晰 */
    background-color: #000;
  }

  /* 灵动岛 / 刘海 */
  .dynamic-island {
    position: absolute;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    width: 110px;
    height: 32px;
    background: #000;
    border-radius: 20px;
    z-index: 20;
  }

  /* ===== 状态栏（叠加在图片上方） ===== */
  .status-bar {
    position: absolute;
    top: 0; left: 0; right: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 18px 26px 0;
    font-size: 14px;
    font-weight: 600;
    color: #fff; /* 如果你的图片背景偏白，请改成 #000 */
    z-index: 10;
  }
  .status-left { display: flex; align-items: center; gap: 6px; }
  .status-right { display: flex; gap: 6px; align-items: center; }

  .signal { display: flex; align-items: flex-end; gap: 2px; height: 12px; }
  .signal span { width: 3px; background: #fff; border-radius: 1px; }
  .signal span:nth-child(1) { height: 4px; }
  .signal span:nth-child(2) { height: 7px; }
  .signal span:nth-child(3) { height: 9px; }
  .signal span:nth-child(4) { height: 12px; opacity: 0.4; }

  .wifi { font-size: 13px; }
  .battery {
    width: 26px; height: 13px;
    border: 1.5px solid #fff;
    border-radius: 4px;
    position: relative;
    padding: 1.5px;
  }
  .battery::after {
    content: ""; position: absolute; right: -4px; top: 4px;
    width: 2px; height: 5px; background: #fff; border-radius: 0 1px 1px 0;
  }
  .battery-fill { width: 78%; height: 100%; background: #fff; border-radius: 1.5px; }

  /* ===== 底部 Home 指示条 ===== */
  .home-bar {
    position: absolute;
    bottom: 9px;
    left: 50%;
    transform: translateX(-50%);
    width: 130px;
    height: 5px;
    background: rgba(255, 255, 255, 0.7);
    border-radius: 3px;
    z-index: 10;
  }

  /* ===== 上滑解锁交互区域（隐形） ===== */
  .swipe-area {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 120px;
    z-index: 30;
    cursor: grab;
  }
  .swipe-area:active { cursor: grabbing; }

</style>
</head>
<body>

<div class="phone">
  <div class="screen" id="screen">
    
    <!-- 灵动岛 -->
    <div class="dynamic-island"></div>

    <!-- 状态栏 -->
    <div class="status-bar">
      <div class="status-left">
        <!-- 可以在图片上留空，或者放一个时间 -->
      </div>
      <div class="status-right">
        <div class="signal"><span></span><span></span><span></span><span></span></div>
        <span class="wifi">📶</span>
        <div class="battery"><div class="battery-fill"></div></div>
      </div>
    </div>

    <!-- 底部 Home 条 -->
    <div class="home-bar"></div>

    <!-- 上滑解锁感应区 -->
    <div class="swipe-area" id="swipeArea"></div>

  </div>
</div>

<script>
  // 简单的上滑解锁动画演示
  const screen = document.getElementById('screen');
  const swipeArea = document.getElementById('swipeArea');
  let startY = 0;
  let isDragging = false;

  // 支持鼠标和触摸
  const getY = (e) => e.touches ? e.touches[0].clientY : e.clientY;

  swipeArea.addEventListener('mousedown', startSwipe);
  swipeArea.addEventListener('touchstart', startSwipe, {passive: true});

  function startSwipe(e) {
    startY = getY(e);
    isDragging = true;
    screen.style.transition = 'none';
  }

  document.addEventListener('mousemove', moveSwipe);
  document.addEventListener('touchmove', moveSwipe, {passive: false});

  function moveSwipe(e) {
    if (!isDragging) return;
    const currentY = getY(e);
    const diff = currentY - startY;
    
    // 只允许向上滑动（diff < 0）
    if (diff < 0) {
      // 跟着手指移动，带点阻尼
      screen.style.transform = `translateY(${diff * 0.8}px)`;
      screen.style.opacity = 1 + (diff / 600); // 越往上越透明
    }
  }

  document.addEventListener('mouseup', endSwipe);
  document.addEventListener('touchend', endSwipe);

  function endSwipe() {
    if (!isDragging) return;
    isDragging = false;
    screen.style.transition = 'transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.4s ease';
    
    // 获取当前的位移
    const currentTransform = screen.style.transform;
    const match = currentTransform.match(/translateY\(([-0-9.]+)px\)/);
    const currentY = match ? parseFloat(match[1]) : 0;

    if (currentY < -100) {
      // 滑得足够高，直接解锁（滑出屏幕）
      screen.style.transform = 'translateY(-100%)';
      screen.style.opacity = '0';
      
      // 解锁后的操作，比如0.5秒后恢复或显示桌面
      setTimeout(() => {
        alert('已解锁！你可以在这里用 JS 切换到主屏幕。');
        // 恢复初始状态
        screen.style.transform = 'translateY(0)';
        screen.style.opacity = '1';
      }, 500);

    } else {
      // 没滑到位，弹回原位
      screen.style.transform = 'translateY(0)';
      screen.style.opacity = '1';
    }
  }
</script>

</body>
</html>
