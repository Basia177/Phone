<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>虚拟手机 · 锁屏</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: radial-gradient(circle at 30% 20%, #1e1b4b, #0a0a14 70%);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
                 "PingFang SC", "Microsoft YaHei", sans-serif;
    padding: 20px;
  }

  /* ===== 手机外壳 ===== */
  .phone {
    width: 340px;
    height: 700px;
    background: #0a0a0a;
    border-radius: 48px;
    padding: 10px;
    position: relative;
    box-shadow:
      0 0 0 2px #2c2c2e,
      0 0 0 5px #1a1a1a,
      0 40px 80px rgba(0, 0, 0, 0.7),
      inset 0 0 0 1px #3a3a3c;
  }

  /* 侧边按键 */
  .phone::before,
  .phone::after {
    content: "";
    position: absolute;
    width: 3px;
    background: #2c2c2e;
    border-radius: 2px;
  }
  .phone::before { left: -4px; top: 130px; height: 65px; }   /* 音量键 */
  .phone::after  { right: -4px; top: 150px; height: 95px; }  /* 电源键 */

  /* ===== 屏幕 ===== */
  .screen {
    width: 100%;
    height: 100%;
    border-radius: 38px;
    overflow: hidden;
    position: relative;
    /* 锁屏壁纸：深色渐变 + 光晕 */
    background:
      radial-gradient(circle at 20% 15%, rgba(120, 90, 255, 0.45), transparent 55%),
      radial-gradient(circle at 85% 75%, rgba(255, 90, 160, 0.35), transparent 50%),
      radial-gradient(circle at 60% 40%, rgba(60, 200, 255, 0.25), transparent 60%),
      linear-gradient(160deg, #1a1035 0%, #0d0a1f 50%, #050510 100%);
    display: flex;
    flex-direction: column;
    color: #fff;
  }

  /* 灵动岛 */
  .dynamic-island {
    position: absolute;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    width: 110px;
    height: 32px;
    background: #000;
    border-radius: 20px;
    z-index: 20;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.06);
  }

  /* ===== 状态栏 ===== */
  .status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 26px 0;
    font-size: 14px;
    font-weight: 600;
    z-index: 10;
    letter-spacing: 0.3px;
  }
  .status-left { display: flex; align-items: center; gap: 6px; }
  .status-right { display: flex; gap: 6px; align-items: center; }

  .signal { display: flex; align-items: flex-end; gap: 2px; height: 12px; }
  .signal span {
    width: 3px;
    background: #fff;
    border-radius: 1px;
  }
  .signal span:nth-child(1) { height: 4px; }
  .signal span:nth-child(2) { height: 7px; }
  .signal span:nth-child(3) { height: 9px; }
  .signal span:nth-child(4) { height: 12px; opacity: 0.4; }

  .wifi { font-size: 13px; }
  .battery {
    width: 26px; height: 13px;
    border: 1.5px solid rgba(255,255,255,0.9);
    border-radius: 4px;
    position: relative;
    padding: 1.5px;
  }
  .battery::after {
    content: "";
    position: absolute;
    right: -4px; top: 4px;
    width: 2px; height: 5px;
    background: rgba(255,255,255,0.9);
    border-radius: 0 1px 1px 0;
  }
  .battery-fill {
    width: 78%; height: 100%;
    background: linear-gradient(90deg, #4ade80, #22c55e);
    border-radius: 1.5px;
  }

  /* ===== 锁屏核心内容 ===== */
  .lock-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 24px;
    z-index: 5;
  }

  /* 锁图标 */
  .lock-icon {
    margin-top: 40px;
    width: 34px; height: 34px;
    border-radius: 50%;
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(10px);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    border: 1px solid rgba(255,255,255,0.12);
  }

  /* 时间 */
  .time {
    margin-top: 18px;
    font-size: 88px;
    font-weight: 200;
    letter-spacing: -3px;
    line-height: 1;
    background: linear-gradient(180deg, #ffffff 0%, #c7c7e0 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 4px 30px rgba(150, 130, 255, 0.35);
    font-variant-numeric: tabular-nums;
  }

  /* 日期 + 年份 */
  .date-row {
    margin-top: 8px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 17px;
    font-weight: 500;
    color: rgba(255,255,255,0.92);
    letter-spacing: 0.5px;
  }
  .date-row .dot {
    width: 4px; height: 4px;
    border-radius: 50%;
    background: rgba(255,255,255,0.5);
  }
  .date-row .year {
    color: rgba(255,255,255,0.65);
    font-weight: 400;
    font-size: 15px;
  }

  /* ===== 通知卡片 ===== */
  .notifications {
    width: 100%;
    margin-top: 34px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .notif {
    display: flex;
    gap: 12px;
    padding: 13px 14px;
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 18px;
    align-items: center;
    animation: slideIn 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
    transition: background 0.25s, transform 0.25s;
    cursor: pointer;
  }
  .notif:hover {
    background: rgba(255,255,255,0.14);
    transform: translateX(3px);
  }
  .notif:nth-child(1) { animation-delay: 0.1s; }
  .notif:nth-child(2) { animation-delay: 0.2s; }
  .notif:nth-child(3) { animation-delay: 0.3s; }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .notif-icon {
    width: 38px; height: 38px;
    border-radius: 11px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
  }
  .ni-msg  { background: linear-gradient(135deg, #34d399, #059669); }
  .ni-cam  { background: linear-gradient(135deg, #f472b6, #db2777); }
  .ni-sys  { background: linear-gradient(135deg, #60a5fa, #2563eb); }

  .notif-body { flex: 1; min-width: 0; }
  .notif-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 3px;
  }
  .notif-title {
    font-size: 13.5px;
    font-weight: 600;
    color: #fff;
  }
  .notif-time {
    font-size: 11px;
    color: rgba(255,255,255,0.5);
  }
  .notif-text {
    font-size: 12.5px;
    color: rgba(255,255,255,0.7);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ===== 底部快捷按钮 ===== */
  .quick-actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 30px 26px;
    width: 100%;
    z-index: 5;
  }

  .qa-btn {
    width: 50px; height: 50px;
    border-radius: 50%;
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.12);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    cursor: pointer;
    transition: transform 0.2s, background 0.2s;
  }
  .qa-btn:hover {
    transform: scale(1.1);
    background: rgba(255,255,255,0.2);
  }

  /* 底部 Home 指示条 */
  .home-bar {
    position: absolute;
    bottom: 9px;
    left: 50%;
    transform: translateX(-50%);
    width: 130px;
    height: 5px;
    background: rgba(255,255,255,0.55);
    border-radius: 3px;
    z-index: 10;
  }
</style>
</head>
<body>

<div class="phone">
  <div class="screen">

    <!-- 灵动岛 -->
    <div class="dynamic-island"></div>

    <!-- 状态栏 -->
    <div class="status-bar">
      <div class="status-left">
        <span id="statusTime">9:41</span>
      </div>
      <div class="status-right">
        <div class="signal"><span></span><span></span><span></span><span></span></div>
        <span class="wifi">📶</span>
        <div class="battery"><div class="battery-fill"></div></div>
      </div>
    </div>

    <!-- 锁屏内容 -->
    <div class="lock-content">

      <!-- 锁图标 -->
      <div class="lock-icon">🔒</div>

      <!-- 时间 -->
      <div class="time" id="clock">9:41</div>

      <!-- 日期 + 年份 -->
      <div class="date-row">
        <span id="weekday">星期一</span>
        <span class="dot"></span>
        <span id="monthDay">1月1日</span>
        <span class="dot"></span>
        <span class="year" id="year">2025</span>
      </div>

      <!-- 通知 -->
      <div class="notifications">
        <div class="notif">
          <div class="notif-icon ni-msg">💬</div>
          <div class="notif-body">
            <div class="notif-head">
              <span class="notif-title">未知号码</span>
              <span class="notif-time">刚刚</span>
            </div>
            <div class="notif-text">你捡到这部手机了吗？</div>
          </div>
        </div>

        <div class="notif">
          <div class="notif-icon ni-cam">📸</div>
          <div class="notif-body">
            <div class="notif-head">
              <span class="notif-title">相册</span>
              <span class="notif-time">2 分钟前</span>
            </div>
            <div class="notif-text">昨晚 23:47 有 5 张新照片</div>
          </div>
        </div>

        <div class="notif">
          <div class="notif-icon ni-sys">🔋</div>
          <div class="notif-body">
            <div class="notif-head">
              <span class="notif-title">系统</span>
              <span class="notif-time">5 分钟前</span>
            </div>
            <div class="notif-text">电量仅剩 18%，请尽快充电</div>
          </div>
        </div>
      </div>
    </div>

    <!-- 底部快捷按钮 -->
    <div class="quick-actions">
      <div class="qa-btn">🔦</div>
      <div class="qa-btn">📷</div>
    </div>

    <!-- Home 指示条 -->
    <div class="home-bar"></div>

  </div>
</div>

<script>
  // 实时时间 + 日期 + 年份
  function updateClock() {
    const now = new Date();

    // 时间：HH:MM（12 小时制或 24 小时制，这里用 24 小时制）
    const h = String(now.getHours()).padStart(2, '0');
    const m = String(now.getMinutes()).padStart(2, '0');
    const timeStr = `${h}:${m}`;

    // 星期
    const weekdays = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
    const weekday = weekdays[now.getDay()];

    // 月日
    const month = now.getMonth() + 1;
    const day = now.getDate();
    const monthDay = `${month}月${day}日`;

    // 年份
    const year = now.getFullYear();

    document.getElementById('clock').textContent = timeStr;
    document.getElementById('statusTime').textContent = timeStr;
    document.getElementById('weekday').textContent = weekday;
    document.getElementById('monthDay').textContent = monthDay;
    document.getElementById('year').textContent = year;
  }

  updateClock();
  setInterval(updateClock, 1000 * 30); // 每 30 秒刷新一次

  // 通知点击高亮
  document.querySelectorAll('.notif').forEach(n => {
    n.addEventListener('click', () => {
      n.style.background = 'rgba(120,160,255,0.28)';
      setTimeout(() => n.style.background = '', 350);
    });
  });
</script>

</body>
</html>
